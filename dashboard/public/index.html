<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OP-TCG Monitor</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #11141a;
      --card: #181c25;
      --border: #23283a;
      --text: #e8eaf0;
      --muted: #6b7394;
      --accent: #f0c040;
      --ok: #2ecc88;
      --warn: #f5a623;
      --danger: #e05555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 0 2rem; height: 56px;
    }
    .logo { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    nav { display: flex; gap: 0.25rem; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      padding: 0.35rem 0.9rem; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a.active { color: var(--accent); background: rgba(240,192,64,0.1); }
    .header-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* ── Buttons ── */
    .btn {
      border: 0; border-radius: 7px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; padding: 0.45rem 1rem; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #111; }
    .btn-danger  { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Main ── */
    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
    .stat {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.2rem;
    }
    .stat .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .val { font-size: 1.5rem; font-weight: 700; margin-top: 0.4rem; }

    /* ── Filters ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .filter-btn {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
      padding: 0.3rem 0.85rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: rgba(240,192,64,0.12); color: var(--accent); border-color: var(--accent); }

    /* ── Section title ── */
    .section-title {
      font-size: 0.75rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      margin: 1.75rem 0 0.75rem;
    }

    /* ── Product cards ── */
    .list { display: grid; gap: 0.6rem; }
    .product {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.9rem 1rem; display: grid;
      grid-template-columns: 72px 1fr auto; gap: 1rem; align-items: center;
      transition: border-color 0.15s;
    }
    .product:hover { border-color: #34394f; }
    .product img { width: 72px; height: 72px; object-fit: cover; border-radius: 7px; background: #0a0c10; }
    .product .title a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
    .product .title a:hover { color: var(--accent); }
    .product .meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .sep { color: var(--border); }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .badge::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
    .badge.preorder    { background: rgba(240,192,64,0.12); color: var(--accent); }
    .badge.preorder::before { background: var(--accent); }
    .badge.in_stock    { background: rgba(46,204,136,0.12); color: var(--ok); }
    .badge.in_stock::before { background: var(--ok); }
    .badge.out_of_stock { background: rgba(224,85,85,0.1); color: var(--danger); }
    .badge.out_of_stock::before { background: var(--danger); }
    .badge.unknown     { background: rgba(107,115,148,0.15); color: var(--muted); }
    .badge.unknown::before { background: var(--muted); }

    .lang-badge { font-size: 0.7rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface); color: var(--muted); }

    /* ── Accordion ── */
    .accordion { margin-top: 1.5rem; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.2rem; background: var(--card); cursor: pointer; user-select: none;
      transition: background 0.15s;
    }
    .accordion-header:hover { background: #1a1e28; }
    .accordion-header .acc-title { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.6rem; }
    .acc-count { background: var(--surface); color: var(--muted); font-size: 0.75rem; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); }
    .accordion-chevron { color: var(--muted); font-size: 0.75rem; transition: transform 0.2s; }
    .accordion.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 1rem; border-top: 1px solid var(--border); }
    .accordion.open .accordion-body { display: block; }

    /* ── Vue toggle ── */
    .view-toggle { display: flex; gap: 0.15rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .view-toggle button {
      background: transparent; border: 0; color: var(--muted); cursor: pointer;
      font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 6px;
    }
    .view-toggle button.active { background: var(--card); color: var(--text); }

    /* ── Cartes référence ── */
    .ref {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 0.6rem; overflow: hidden;
    }
    .ref.has-stock { border-color: rgba(46,204,136,0.35); }
    .ref-head {
      display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center;
      padding: 0.85rem 1.1rem; cursor: pointer; user-select: none;
    }
    .ref-head:hover { background: #1a1e28; }
    .ref-name { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .ref-format { color: var(--muted); font-weight: 500; }
    .ref-sub { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .ref-best { color: var(--ok); font-weight: 700; }
    .ref-right { text-align: right; display: flex; align-items: center; gap: 0.8rem; }
    .ref-chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; }
    .ref.open .ref-chevron { transform: rotate(180deg); }
    .ref-body { display: none; border-top: 1px solid var(--border); }
    .ref.open .ref-body { display: block; }

    /* ── Lignes d'offre ── */
    .offer {
      display: grid; grid-template-columns: 34px 78px 1fr auto auto; gap: 0.75rem;
      align-items: center; padding: 0.55rem 1.1rem; font-size: 0.84rem;
      border-top: 1px solid rgba(35,40,58,0.5);
    }
    .offer:first-child { border-top: 0; }
    .offer:hover { background: rgba(255,255,255,0.02); }
    .offer-lang { font-size: 0.9rem; }
    .offer-price { font-weight: 700; white-space: nowrap; }
    .offer-site a { color: var(--text); text-decoration: none; font-weight: 600; }
    .offer-site a:hover { color: var(--accent); }
    .offer-title { color: var(--muted); font-size: 0.76rem; margin-top: 0.15rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
    .offer-delta { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

    @media (max-width: 720px) {
      .offer { grid-template-columns: 28px 70px 1fr; }
      .offer-delta, .offer .badge { display: none; }
      .ref-head { grid-template-columns: 1fr; }
      .ref-right { justify-content: flex-start; }
    }

    /* ── Empty ── */
    .empty { text-align: center; color: var(--muted); padding: 4rem 2rem; font-size: 0.9rem; }
    .empty p { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎴 OP-TCG Monitor</div>
    <nav>
      <a href="/" class="active">Produits</a>
      <a href="/health.html">Santé</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-primary" id="scanBtn">Lancer un scan</button>
      <button class="btn btn-danger" id="clearBtn">Vider</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <div class="view-toggle">
        <button id="viewRefBtn" class="active">Par référence</button>
        <button id="viewFlatBtn">Par annonce</button>
      </div>
    </div>
    <div id="content"></div>
  </main>

  <script>
    const statsEl   = document.getElementById('stats');
    const contentEl = document.getElementById('content');
    const filtersEl = document.getElementById('filters');
    const scanBtn   = document.getElementById('scanBtn');
    const clearBtn  = document.getElementById('clearBtn');

    const viewRefBtn  = document.getElementById('viewRefBtn');
    const viewFlatBtn = document.getElementById('viewFlatBtn');

    const accState = {};
    const refState = {};
    let activeLang = 'all';
    let view = localStorage.getItem('optcg.view') || 'ref';

    const LANG_LABELS = { fr: '🇫🇷 FR', en: '🇬🇧 EN', jp: '🇯🇵 JP', cn: '🇨🇳 CN', null: '❓' };
    const LANG_FLAGS  = { fr: '🇫🇷', en: '🇬🇧', jp: '🇯🇵', cn: '🇨🇳' };

    const fmtPrice = v => v === null || v === undefined
      ? '—' : v.toFixed(2).replace('.', ',') + ' €';

    async function loadStats() {
      const s = await fetch('/api/stats').then(r => r.json());
      statsEl.innerHTML = `
        <div class="stat"><div class="label">Cycles</div><div class="val">${s.cycle ?? 0}</div></div>
        <div class="stat"><div class="label">Événements</div><div class="val">${s.totalEvents ?? 0}</div></div>
        <div class="stat"><div class="label">Erreurs</div><div class="val" style="color:var(--danger)">${s.errors ?? 0}</div></div>
        <div class="stat"><div class="label">Dernier run</div><div class="val" style="font-size:0.95rem">${s.lastRunAt ? new Date(s.lastRunAt).toLocaleTimeString() : '—'}</div></div>
        <div class="stat"><div class="label">Statut</div><div class="val" style="font-size:1rem">${s.running ? '<span style="color:var(--ok)">● En cours</span>' : '<span style="color:var(--muted)">◦ Idle</span>'}</div></div>
      `;
    }

    // ── Vue comparateur : une carte par référence (set + format), toutes
    //    boutiques confondues. Répond à « qui a l'OP-16 display et à quel prix »
    //    au lieu d'aligner 22 flux indépendants.
    async function loadReferences() {
      const d = await fetch('/api/references').then(r => r.json());

      if (!d.references.length && !d.unclassified.length) {
        filtersEl.innerHTML = '';
        contentEl.innerHTML = `<div class="empty"><div style="font-size:2rem">🔍</div><p>Aucun produit détecté. Le bot scanne en arrière-plan...</p></div>`;
        return;
      }

      // Filtre langue : une référence reste visible si au moins une de ses
      // offres est dans la langue choisie, et on n'affiche alors que celles-ci.
      const langsSet = new Set();
      d.references.forEach(r => r.langs.forEach(l => langsSet.add(l === 'unknown' ? 'null' : l)));
      renderLangFilters([...langsSet]);

      const refs = d.references
        .map(r => activeLang === 'all' ? r : filterRefByLang(r))
        .filter(Boolean);

      const withStock = refs.filter(r => r.availableCount > 0);
      const without   = refs.filter(r => r.availableCount === 0);

      let html = '';
      if (withStock.length) {
        html += `<div class="section-title">Disponibles · ${withStock.length} référence${withStock.length > 1 ? 's' : ''}</div>`;
        html += withStock.map(refCard).join('');
      } else {
        html += `<div class="empty" style="padding:2rem 0"><p>Aucune référence disponible actuellement.</p></div>`;
      }

      if (without.length) {
        html += accordion('acc-ref-oos', 'Épuisés / Inconnus', without.length, without.map(refCard).join(''), false);
      }
      if (d.unclassified.length) {
        html += accordion('acc-unclassified', 'Non classés (lots, binders…)', d.unclassified.length,
          `<div class="list">${d.unclassified.map(looseCard).join('')}</div>`, false);
      }

      contentEl.innerHTML = html;
    }

    // Ne conserve que les annonces de la langue active ; recalcule les compteurs
    // sur ce sous-ensemble pour que l'en-tête reste cohérent avec le filtre.
    function filterRefByLang(ref) {
      const offers = ref.offers.filter(o => (o.lang ?? 'null') === activeLang);
      if (!offers.length) return null;
      return {
        ...ref, offers,
        offerCount: offers.length,
        availableCount: offers.filter(o => o.available).length,
        siteCount: new Set(offers.map(o => o.site)).size,
        langs: [...new Set(offers.map(o => o.lang ?? 'unknown'))],
      };
    }

    function refCard(ref) {
      const isOpen = refState[ref.key] ?? ref.availableCount > 0;
      return `
        <div class="ref ${ref.availableCount > 0 ? 'has-stock' : ''} ${isOpen ? 'open' : ''}" id="ref-${escapeAttr(ref.key)}">
          <div class="ref-head" onclick="toggleRef('${escapeAttr(ref.key)}')">
            <div>
              <div class="ref-name">
                ${escapeHtml(ref.setLabel)}
                ${ref.langs.filter(l => l !== 'unknown').map(l => `<span class="lang-badge">${LANG_LABELS[l] ?? l}</span>`).join('')}
              </div>
              <div class="ref-sub">
                <span>${ref.offerCount} annonce${ref.offerCount > 1 ? 's' : ''}</span>
                <span class="sep">·</span>
                <span>${ref.siteCount} boutique${ref.siteCount > 1 ? 's' : ''}</span>
                <span class="sep">·</span>
                ${ref.availableCount > 0
                  ? `<span class="ref-best">${ref.availableCount} dispo</span>`
                  : `<span>aucune dispo</span>`}
              </div>
            </div>
            <div class="ref-right"><span class="ref-chevron">▼</span></div>
          </div>
          <div class="ref-body">${ref.offers.map(offerRow).join('')}</div>
        </div>`;
    }

    function offerRow(offer) {
      return `
        <div class="offer">
          <span class="offer-lang">${offer.lang ? (LANG_FLAGS[offer.lang] ?? offer.lang) : '❓'}</span>
          <span class="offer-price">${fmtPrice(offer.priceValue)}</span>
          <div class="offer-site">
            <a href="${escapeAttr(offer.url)}" target="_blank" rel="noopener">${escapeHtml(offer.site)} ↗</a>
            <div class="offer-title" title="${escapeAttr(offer.title)}">${escapeHtml(offer.title)}</div>
          </div>
          <span class="offer-delta">${escapeHtml(offer.formatLabel ?? '')}</span>
          <span class="badge ${offer.status}">${badgeLabel(offer.status)}</span>
        </div>`;
    }

    function looseCard(offer) {
      return `
        <div class="product" style="grid-template-columns:1fr auto">
          <div>
            <div class="title"><a href="${escapeAttr(offer.url)}" target="_blank" rel="noopener">${escapeHtml(offer.title)}</a></div>
            <div class="meta">
              <span class="badge ${offer.status}">${badgeLabel(offer.status)}</span>
              <span class="sep">·</span>${fmtPrice(offer.priceValue)}
              <span class="sep">·</span>${escapeHtml(offer.site)}
              <span class="sep">·</span>${escapeHtml(offer.formatLabel ?? '')}
            </div>
          </div>
        </div>`;
    }

    function accordion(id, title, count, inner, defaultOpen) {
      const isOpen = accState[id] ?? defaultOpen;
      return `
        <div class="accordion ${isOpen ? 'open' : ''}" id="${id}">
          <div class="accordion-header" onclick="toggleAcc('${id}')">
            <span class="acc-title">${title} <span class="acc-count">${count}</span></span>
            <span class="accordion-chevron">▼</span>
          </div>
          <div class="accordion-body">${inner}</div>
        </div>`;
    }

    function renderLangFilters(langs) {
      const all = ['all', ...langs];
      filtersEl.innerHTML = all.map(l => {
        const label = l === 'all' ? 'Tous' : (LANG_LABELS[l] ?? l);
        return `<button class="filter-btn ${activeLang === l ? 'active' : ''}" onclick="setLang('${l}')">${label}</button>`;
      }).join('');
    }

    function toggleRef(key) {
      const el = document.getElementById('ref-' + key);
      refState[key] = el.classList.toggle('open');
    }

    async function loadProducts() {
      const d = await fetch('/api/products').then(r => r.json());

      if (!d.products.length) {
        filtersEl.innerHTML = '';
        contentEl.innerHTML = `<div class="empty"><div style="font-size:2rem">🔍</div><p>Aucun produit détecté. Le bot scanne en arrière-plan...</p></div>`;
        return;
      }

      const langs = ['all', ...new Set(d.products.map(p => p.lang ?? 'null'))];
      filtersEl.innerHTML = langs.map(l => {
        const label = l === 'all' ? 'Tous' : (LANG_LABELS[l] ?? l);
        return `<button class="filter-btn ${activeLang === l ? 'active' : ''}" onclick="setLang('${l}')">${label}</button>`;
      }).join('');

      const filtered    = activeLang === 'all' ? d.products : d.products.filter(p => (p.lang ?? 'null') === activeLang);
      const available   = filtered.filter(p => p.status === 'preorder' || p.status === 'in_stock');
      const unavailable = filtered.filter(p => p.status === 'out_of_stock' || p.status === 'unknown');

      let html = '';

      if (available.length) {
        html += `<div class="section-title">Disponibles · ${available.length}</div>`;
        html += `<div class="list">${available.map(productCard).join('')}</div>`;
      } else {
        html += `<div class="empty" style="padding:2rem 0"><p>Aucun produit disponible actuellement.</p></div>`;
      }

      if (unavailable.length) {
        const id = 'acc-oos';
        const isOpen = accState[id] !== false;
        html += `
          <div class="accordion ${isOpen ? 'open' : ''}" id="${id}">
            <div class="accordion-header" onclick="toggleAcc('${id}')">
              <span class="acc-title">Épuisés / Inconnus <span class="acc-count">${unavailable.length}</span></span>
              <span class="accordion-chevron">▼</span>
            </div>
            <div class="accordion-body">
              <div class="list">${unavailable.map(productCard).join('')}</div>
            </div>
          </div>`;
      }

      contentEl.innerHTML = html;
    }

    function setLang(lang) { activeLang = lang; renderView(); }

    function setView(next) {
      view = next;
      localStorage.setItem('optcg.view', next);
      viewRefBtn.classList.toggle('active', next === 'ref');
      viewFlatBtn.classList.toggle('active', next === 'flat');
      renderView();
    }

    function renderView() {
      return view === 'ref' ? loadReferences() : loadProducts();
    }

    function toggleAcc(id) {
      const el = document.getElementById(id);
      accState[id] = el.classList.toggle('open');
    }

    function productCard(p) {
      const langLabel = p.lang ? (LANG_LABELS[p.lang] ?? p.lang) : '';
      return `
        <div class="product">
          <img src="${p.image || ''}" onerror="this.style.visibility='hidden'" loading="lazy" />
          <div>
            <div class="title">
              <a href="${escapeHtml(p.url)}" target="_blank">${escapeHtml(p.title)}</a>
              ${langLabel ? `<span class="lang-badge">${langLabel}</span>` : ''}
            </div>
            <div class="meta">
              <span class="badge ${p.status}">${badgeLabel(p.status)}</span>
              ${p.price ? `<span class="sep">·</span>${escapeHtml(p.price)}` : ''}
              <span class="sep">·</span>${escapeHtml(p.site)}
              <span class="sep">·</span>${timeAgo(p.lastSeenAt)}
            </div>
          </div>
          <div style="text-align:right;color:var(--muted);font-size:0.75rem;white-space:nowrap">
            ${p.notifiedAt ? '🔔' : ''}
          </div>
        </div>`;
    }

    function badgeLabel(s) {
      return { preorder: 'Précommande', in_stock: 'En stock', out_of_stock: 'Épuisé', unknown: 'Inconnu' }[s] ?? s;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    // Pour les valeurs injectées dans un attribut (href, title, id) : les
    // apostrophes doivent aussi être échappées, sinon un titre boutique
    // contenant ' casserait l'attribut.
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function timeAgo(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60)    return 'il y a ' + Math.floor(diff) + 's';
      if (diff < 3600)  return 'il y a ' + Math.floor(diff / 60) + ' min';
      if (diff < 86400) return 'il y a ' + Math.floor(diff / 3600) + ' h';
      return 'il y a ' + Math.floor(diff / 86400) + ' j';
    }

    scanBtn.addEventListener('click', async () => {
      scanBtn.disabled = true; scanBtn.textContent = 'En cours...';
      await fetch('/api/scan', { method: 'POST' });
      setTimeout(() => { scanBtn.disabled = false; scanBtn.textContent = 'Lancer un scan'; loadAll(); }, 2000);
    });

    clearBtn.addEventListener('click', async () => {
      if (!confirm('Vider tous les produits détectés ?')) return;
      clearBtn.disabled = true;
      await fetch('/api/products', { method: 'DELETE' });
      clearBtn.disabled = false;
      loadAll();
    });

    viewRefBtn.addEventListener('click', () => setView('ref'));
    viewFlatBtn.addEventListener('click', () => setView('flat'));

    async function loadAll() { await Promise.all([loadStats(), renderView()]); }

    viewRefBtn.classList.toggle('active', view === 'ref');
    viewFlatBtn.classList.toggle('active', view === 'flat');
    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
