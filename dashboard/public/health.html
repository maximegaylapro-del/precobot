<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Santé des scrapers — OP-TCG Monitor</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #11141a;
      --card: #181c25;
      --border: #23283a;
      --text: #e8eaf0;
      --muted: #6b7394;
      --accent: #f0c040;
      --ok: #2ecc88;
      --warn: #f5a623;
      --danger: #e05555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 0 2rem; height: 56px;
    }
    .logo { font-size: 1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    nav { display: flex; gap: 0.25rem; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      padding: 0.35rem 0.9rem; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a.active { color: var(--accent); background: rgba(240,192,64,0.1); }

    /* ── Main ── */
    main { padding: 2rem; max-width: 1000px; margin: 0 auto; }

    /* ── Summary ── */
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; }
    .stat .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .val { font-size: 1.5rem; font-weight: 700; margin-top: 0.4rem; }

    /* ── Scraper cards ── */
    .scraper-list { display: grid; gap: 0.6rem; }
    .scraper-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; transition: border-color 0.15s;
    }
    .scraper-card:hover { border-color: #34394f; }
    .scraper-card.suspect { border-color: rgba(245,166,35,0.4); }
    .scraper-card.suspect .scraper-header { background: rgba(245,166,35,0.04); }
    .scraper-card.disabled { opacity: 0.55; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .track {
      position: absolute; inset: 0; cursor: pointer; background: var(--border);
      border-radius: 22px; transition: background 0.2s;
    }
    .toggle .track::before {
      content: ''; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: transform 0.2s;
    }
    .toggle input:checked + .track { background: var(--ok); }
    .toggle input:checked + .track::before { transform: translateX(18px); }
    .toggle input:disabled + .track { cursor: wait; opacity: 0.5; }

    /* ── Alert banner ── */
    .alert-banner {
      background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.35);
      border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.5rem;
      display: flex; gap: 0.75rem; align-items: flex-start;
    }
    .alert-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.1rem; }
    .alert-title { font-weight: 700; color: var(--warn); margin-bottom: 0.4rem; font-size: 0.9rem; }
    .alert-list { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
    .alert-list li { font-size: 0.82rem; color: var(--text); }
    .alert-list li span { color: var(--muted); }
    .scraper-header {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
      align-items: center; padding: 0.9rem 1.2rem;
      cursor: pointer; user-select: none; gap: 1rem;
    }
    .scraper-header:hover { background: #1a1e28; }

    .scraper-name { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .col-label { color: var(--muted); font-size: 0.8rem; }
    .col-val { font-size: 0.85rem; }

    /* Status dot */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.ok      { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
    .dot.error   { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
    .dot.pending { background: var(--muted); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .badge.ok      { background: rgba(46,204,136,0.12); color: var(--ok); }
    .badge.error   { background: rgba(224,85,85,0.12); color: var(--danger); }
    .badge.warn    { background: rgba(245,166,35,0.12); color: var(--warn); }
    .badge.pending { background: rgba(107,115,148,0.12); color: var(--muted); }

    /* Expanded URLs */
    .scraper-body {
      display: none; border-top: 1px solid var(--border);
      padding: 0.75rem 1.2rem; background: var(--surface);
    }
    .scraper-card.open .scraper-body { display: block; }
    .url-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
    .url-list li { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
    .url-list a { color: var(--accent); text-decoration: none; word-break: break-all; }
    .url-list a:hover { text-decoration: underline; }
    .url-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex-shrink: 0; }

    .chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; margin-left: auto; }
    .scraper-card.open .chevron { transform: rotate(180deg); }

    /* Table header */
    .table-header {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
      padding: 0.5rem 1.2rem; gap: 1rem; margin-bottom: 0.4rem;
    }
    .table-header span { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .refresh { color: var(--muted); font-size: 0.78rem; margin-top: 1.25rem; text-align: right; }

    .err-msg { color: var(--danger); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    /* ── Section manuelle ── */
    .section-title { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 2rem 0 0.75rem; }
    .manual-list { display: grid; gap: 0.5rem; }
    .manual-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.9rem 1.2rem; display: flex; align-items: center; gap: 1rem;
    }
    .manual-name { font-weight: 600; font-size: 0.9rem; min-width: 140px; color: var(--muted); }
    .manual-urls { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .manual-urls a {
      color: var(--accent); text-decoration: none; font-size: 0.8rem;
      background: rgba(240,192,64,0.08); border: 1px solid rgba(240,192,64,0.2);
      padding: 2px 10px; border-radius: 20px;
    }
    .manual-urls a:hover { background: rgba(240,192,64,0.18); }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎴 OP-TCG Monitor</div>
    <nav>
      <a href="/">Produits</a>
      <a href="/health.html" class="active">Santé</a>
    </nav>
    <div></div>
  </header>

  <main>
    <div id="alerts"></div>
    <div class="summary" id="summary"></div>

    <div class="table-header">
      <span>Scraper</span>
      <span>Statut</span>
      <span>Produits</span>
      <span>Échecs consécutifs</span>
      <span>Dernier succès</span>
      <span style="text-align:right">Actif</span>
    </div>
    <div class="scraper-list" id="list"></div>

    <div class="section-title">Surveillance manuelle</div>
    <div class="manual-list" id="manual-list"></div>

    <div class="refresh" id="refresh"></div>
  </main>

  <script>
    const openState = {};

    function timeAgo(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60)    return Math.floor(diff) + 's';
      if (diff < 3600)  return Math.floor(diff / 60) + ' min';
      if (diff < 86400) return Math.floor(diff / 3600) + ' h';
      return Math.floor(diff / 86400) + ' j';
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function toggleCard(id) {
      const el = document.getElementById('sc-' + id);
      openState[id] = el.classList.toggle('open');
    }

    async function toggleScraper(name, input) {
      const enabled = input.checked;
      input.disabled = true;
      try {
        const res = await fetch(`/api/scrapers/${encodeURIComponent(name)}/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // Reflète immédiatement l'état visuel de la carte
        document.getElementById('sc-' + name)?.classList.toggle('disabled', !enabled);
      } catch (err) {
        input.checked = !enabled; // rollback
        alert('Échec du changement pour ' + name + ' : ' + err.message);
      } finally {
        input.disabled = false;
      }
    }

    async function load() {
      const data = await fetch('/api/health').then(r => r.json());

      const total    = data.length;
      const ok       = data.filter(s => s.lastStatus === 'ok' && !s.suspect).length;
      const errors   = data.filter(s => s.lastStatus === 'error').length;
      const suspects = data.filter(s => s.suspect);
      const pending  = data.filter(s => !s.lastStatus).length;

      // Bannière d'alerte
      const alertsEl = document.getElementById('alerts');
      if (suspects.length) {
        alertsEl.innerHTML = `
          <div class="alert-banner">
            <div class="alert-icon">⚠️</div>
            <div>
              <div class="alert-title">${suspects.length} scraper${suspects.length > 1 ? 's' : ''} suspect${suspects.length > 1 ? 's' : ''} — 0 produit alors qu'ils en avaient récemment</div>
              <ul class="alert-list">
                ${suspects.map(s => {
                  const ago = s.lastNonZeroAt ? Math.round((Date.now() - new Date(s.lastNonZeroAt).getTime()) / 60000) : null;
                  return `<li><strong>${escapeHtml(s.name)}</strong> — ${s.zeroStreak} cycles à 0 produit <span>· dernier succès il y a ${ago ?? '?'} min</span></li>`;
                }).join('')}
              </ul>
            </div>
          </div>`;
      } else {
        alertsEl.innerHTML = '';
      }

      document.getElementById('summary').innerHTML = `
        <div class="stat"><div class="label">Total</div><div class="val">${total}</div></div>
        <div class="stat"><div class="label">OK</div><div class="val" style="color:var(--ok)">${ok}</div></div>
        <div class="stat"><div class="label">Suspects</div><div class="val" style="color:var(--warn)">${suspects.length}</div></div>
        <div class="stat"><div class="label">En erreur</div><div class="val" style="color:var(--danger)">${errors}</div></div>
        <div class="stat"><div class="label">En attente</div><div class="val" style="color:var(--muted)">${pending}</div></div>
      `;

      document.getElementById('list').innerHTML = data.map(s => {
        const status = s.lastStatus ?? 'pending';
        const isOpen = openState[s.name] || false;

        const failBadge = s.consecutiveFails >= 3
          ? `<span class="badge error">${s.consecutiveFails}×</span>`
          : s.consecutiveFails > 0
            ? `<span class="badge warn">${s.consecutiveFails}×</span>`
            : `<span style="color:var(--muted);font-size:0.82rem">—</span>`;

        const urlsHtml = (s.urls || []).map(u => `
          <li><span class="url-dot"></span><a href="${escapeHtml(u)}" target="_blank">${escapeHtml(u)}</a></li>
        `).join('');

        const lastOkText = s.lastOkAt
          ? `<span style="color:var(--text)">${timeAgo(s.lastOkAt)}</span>`
          : `<span style="color:var(--muted)">—</span>`;

        const statusBadge = s.suspect
          ? `<span class="badge warn">⚠️ Suspect</span>`
          : status === 'ok'
            ? `<span class="badge ok">OK</span>`
            : status === 'error'
              ? `<span class="badge error">Erreur</span>`
              : `<span class="badge pending">En attente</span>`;

        const toggleHtml = `
          <label class="toggle" onclick="event.stopPropagation()" title="${s.enabled ? 'Désactiver' : 'Activer'} ${escapeHtml(s.name)}">
            <input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleScraper('${escapeHtml(s.name)}', this)">
            <span class="track"></span>
          </label>`;

        return `
          <div class="scraper-card ${isOpen ? 'open' : ''} ${s.suspect ? 'suspect' : ''} ${s.enabled ? '' : 'disabled'}" id="sc-${s.name}">
            <div class="scraper-header" onclick="toggleCard('${s.name}')">
              <div class="scraper-name">
                <span class="dot ${status}"></span>
                ${escapeHtml(s.name)}
                <span class="chevron">▼</span>
              </div>
              <div class="col-val">${statusBadge}</div>
              <div class="col-val">${s.lastCount ?? 0}</div>
              <div class="col-val">${failBadge}</div>
              <div class="col-val" style="color:var(--muted);font-size:0.82rem">${lastOkText}</div>
              <div style="text-align:right">${toggleHtml}</div>
            </div>
            <div class="scraper-body">
              ${s.lastError ? `<div class="err-msg" style="margin-bottom:0.6rem">⚠️ ${escapeHtml(s.lastError)}</div>` : ''}
              <ul class="url-list">${urlsHtml || '<li style="color:var(--muted)">Aucune URL configurée</li>'}</ul>
            </div>
          </div>`;
      }).join('');

      document.getElementById('refresh').textContent = 'Actualisé à ' + new Date().toLocaleTimeString();
    }

    async function loadDisabled() {
      const data = await fetch('/api/disabled').then(r => r.json());
      const el = document.getElementById('manual-list');
      if (!data.length) {
        el.innerHTML = '<p style="color:var(--muted);font-size:0.82rem">Aucun scraper désactivé.</p>';
        return;
      }
      el.innerHTML = data.map(s => `
        <div class="manual-card">
          <div class="manual-name">${escapeHtml(s.name)}</div>
          <div class="manual-urls">
            ${s.urls.map(u => `<a href="${escapeHtml(u)}" target="_blank">${escapeHtml(u)}</a>`).join('')}
          </div>
        </div>
      `).join('');
    }

    load();
    loadDisabled();
    setInterval(load, 10000);
  </script>
</body>
</html>
