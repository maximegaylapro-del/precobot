<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achats — OP-TCG Monitor</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #11141a;
      --card: #181c25;
      --border: #23283a;
      --text: #e8eaf0;
      --muted: #6b7394;
      --accent: #f0c040;
      --ok: #2ecc88;
      --warn: #f5a623;
      --danger: #e05555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 0 2rem; height: 56px;
    }
    .logo { font-size: 1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    nav { display: flex; gap: 0.25rem; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      padding: 0.35rem 0.9rem; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a.active { color: var(--accent); background: rgba(240,192,64,0.1); }

    /* ── Main ── */
    main { padding: 2rem; max-width: 800px; margin: 0 auto; }

    /* ── Formulaire ── */
    .add-form {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.25rem 1.5rem; margin-bottom: 2rem;
    }
    .add-form h2 { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 130px 1fr auto; gap: 0.75rem; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field label { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .field input {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.85rem; padding: 0.5rem 0.75rem; outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-add {
      background: var(--accent); color: #0a0c10; border: none; border-radius: 7px;
      font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1.2rem;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── Total ── */
    .total-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.5rem; margin-bottom: 1rem;
    }
    .total-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .total-val { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .total-count { font-size: 0.82rem; color: var(--muted); }

    /* ── Liste ── */
    .purchase-list { display: grid; gap: 0.5rem; }
    .purchase-row {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.85rem 1.2rem; display: grid; grid-template-columns: 1fr auto auto auto;
      align-items: center; gap: 1rem;
    }
    .purchase-name { font-size: 0.9rem; font-weight: 600; }
    .purchase-note { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
    .purchase-price { font-size: 0.95rem; font-weight: 700; color: var(--ok); white-space: nowrap; }
    .purchase-date { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .btn-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 1rem; padding: 0.2rem 0.4rem; border-radius: 5px; transition: color 0.15s, background 0.15s;
    }
    .btn-del:hover { color: var(--danger); background: rgba(224,85,85,0.1); }

    .empty { text-align: center; color: var(--muted); padding: 3rem 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎴 OP-TCG Monitor</div>
    <nav>
      <a href="/">Produits</a>
      <a href="/health.html">Santé</a>
      <a href="/purchases.html" class="active">Achats</a>
    </nav>
    <div></div>
  </header>

  <main>
    <div class="add-form">
      <h2>Ajouter un achat</h2>
      <div class="form-row">
        <div class="field">
          <label>Produit</label>
          <input type="text" id="inp-name" placeholder="Display OP-17 FR…" />
        </div>
        <div class="field">
          <label>Prix (€)</label>
          <input type="number" id="inp-price" placeholder="102.50" step="0.01" min="0" />
        </div>
        <div class="field">
          <label>Note (optionnel)</label>
          <input type="text" id="inp-note" placeholder="Parkage, précommande…" />
        </div>
        <button class="btn-add" onclick="addPurchase()">Ajouter</button>
      </div>
    </div>

    <div class="total-bar">
      <div>
        <div class="total-label">Total investi</div>
        <div class="total-count" id="total-count"></div>
      </div>
      <div class="total-val" id="total-val">0,00 €</div>
    </div>

    <div class="purchase-list" id="list"></div>
  </main>

  <script>
    function fmt(n) {
      return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    async function load() {
      const data = await fetch('/api/purchases').then(r => r.json());
      const total = data.reduce((s, p) => s + p.price, 0);

      document.getElementById('total-val').textContent = fmt(total);
      document.getElementById('total-count').textContent = data.length + ' achat' + (data.length > 1 ? 's' : '');

      const list = document.getElementById('list');
      if (!data.length) {
        list.innerHTML = '<div class="empty">Aucun achat enregistré.</div>';
        return;
      }
      list.innerHTML = data.slice().reverse().map(p => `
        <div class="purchase-row" id="row-${p.id}">
          <div>
            <div class="purchase-name">${escapeHtml(p.name)}</div>
            ${p.note ? `<div class="purchase-note">${escapeHtml(p.note)}</div>` : ''}
          </div>
          <div class="purchase-price">${fmt(p.price)}</div>
          <div class="purchase-date">${fmtDate(p.date)}</div>
          <button class="btn-del" onclick="deletePurchase('${p.id}')" title="Supprimer">✕</button>
        </div>
      `).join('');
    }

    async function addPurchase() {
      const name  = document.getElementById('inp-name').value.trim();
      const price = parseFloat(document.getElementById('inp-price').value);
      const note  = document.getElementById('inp-note').value.trim();
      if (!name || isNaN(price)) return;

      await fetch('/api/purchases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, note }),
      });
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-price').value = '';
      document.getElementById('inp-note').value = '';
      load();
    }

    async function deletePurchase(id) {
      await fetch('/api/purchases/' + id, { method: 'DELETE' });
      load();
    }

    document.getElementById('inp-price').addEventListener('keydown', e => {
      if (e.key === 'Enter') addPurchase();
    });
    document.getElementById('inp-note').addEventListener('keydown', e => {
      if (e.key === 'Enter') addPurchase();
    });

    load();
  </script>
</body>
</html>
