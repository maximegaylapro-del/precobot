<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Achats — OP-TCG Monitor</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #11141a;
      --card: #181c25;
      --border: #23283a;
      --text: #e8eaf0;
      --muted: #6b7394;
      --accent: #f0c040;
      --ok: #2ecc88;
      --warn: #f5a623;
      --danger: #e05555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 0 2rem; height: 56px;
    }
    .logo { font-size: 1rem; font-weight: 700; color: var(--text); }
    nav { display: flex; gap: 0.25rem; }
    nav a {
      color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;
      padding: 0.35rem 0.9rem; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    nav a:hover { color: var(--text); background: var(--surface); }
    nav a.active { color: var(--accent); background: rgba(240,192,64,0.1); }

    main { padding: 2rem; max-width: 860px; margin: 0 auto; }

    /* ── Form card ── */
    .add-form {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .form-title { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1.1rem; }

    .form-grid { display: grid; grid-template-columns: 2fr 1fr 100px 130px auto; gap: 0.75rem; align-items: end; }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; }

    .field input, .field select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.85rem; padding: 0.5rem 0.75rem; outline: none;
      transition: border-color 0.15s; width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select { appearance: none; cursor: pointer; }

    /* Autocomplete */
    .autocomplete-wrap { position: relative; }
    .autocomplete-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      max-height: 220px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .autocomplete-dropdown.open { display: block; }
    .ac-item {
      padding: 0.6rem 0.9rem; cursor: pointer; font-size: 0.82rem;
      border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.15rem;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: rgba(240,192,64,0.08); }
    .ac-item-title { color: var(--text); }
    .ac-item-meta { color: var(--muted); font-size: 0.72rem; }

    .btn-add {
      background: var(--accent); color: #0a0c10; border: none; border-radius: 7px;
      font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1.25rem;
      cursor: pointer; transition: opacity 0.15s; white-space: nowrap; height: 36px;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── Total bar ── */
    .total-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 0.35rem; }

    /* ── List ── */
    .purchase-list { display: grid; gap: 0.45rem; }
    .purchase-row {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.85rem 1.2rem;
      display: grid; grid-template-columns: 1fr auto auto auto auto;
      align-items: center; gap: 1rem;
    }
    .p-name { font-size: 0.88rem; font-weight: 600; }
    .p-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; display: flex; gap: 0.5rem; align-items: center; }
    .p-boutique { background: rgba(107,115,148,0.15); border-radius: 4px; padding: 1px 7px; font-size: 0.7rem; }
    .p-qty { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
    .p-unit { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .p-total { font-size: 0.95rem; font-weight: 700; color: var(--ok); white-space: nowrap; }
    .p-date { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .btn-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.95rem; padding: 0.2rem 0.4rem; border-radius: 5px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-del:hover { color: var(--danger); background: rgba(224,85,85,0.1); }

    .empty { text-align: center; color: var(--muted); padding: 3rem 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎴 OP-TCG Monitor</div>
    <nav>
      <a href="/">Produits</a>
      <a href="/health.html">Santé</a>
      <a href="/purchases.html" class="active">Achats</a>
    </nav>
    <div></div>
  </header>

  <main>
    <div class="add-form">
      <div class="form-title">Ajouter un achat</div>
      <div class="form-grid">

        <div class="field">
          <label>Produit</label>
          <div class="autocomplete-wrap">
            <input type="text" id="inp-name" placeholder="Rechercher… OP-17, display…" autocomplete="off" />
            <div class="autocomplete-dropdown" id="ac-drop"></div>
          </div>
        </div>

        <div class="field">
          <label>Boutique</label>
          <select id="inp-boutique">
            <option value="">— Boutique —</option>
          </select>
        </div>

        <div class="field">
          <label>Qté</label>
          <input type="number" id="inp-qty" value="1" min="1" step="1" />
        </div>

        <div class="field">
          <label>Prix unitaire (€)</label>
          <input type="number" id="inp-price" placeholder="102.50" step="0.01" min="0" />
        </div>

        <button class="btn-add" onclick="addPurchase()">Ajouter</button>
      </div>
    </div>

    <div class="total-bar">
      <div class="stat-card">
        <div class="stat-label">Total investi</div>
        <div class="stat-val" id="stat-total" style="color:var(--accent)">0,00 €</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Lignes</div>
        <div class="stat-val" id="stat-lines" style="color:var(--muted)">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unités</div>
        <div class="stat-val" id="stat-units" style="color:var(--text)">0</div>
      </div>
    </div>

    <div class="purchase-list" id="list"></div>
  </main>

  <script>
    let allProducts = [];
    let acIndex = -1;

    function fmt(n) {
      return (+n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    /* ── Autocomplete ── */
    const inpName = document.getElementById('inp-name');
    const acDrop  = document.getElementById('ac-drop');

    function normalize(s) {
      return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[-_\s]+/g, ' ');
    }

    function acSearch(q) {
      if (!q || q.length < 2) return [];
      const nq = normalize(q);
      return allProducts
        .filter(p => normalize(p.title).includes(nq))
        .slice(0, 10);
    }

    function acRender(results) {
      acIndex = -1;
      if (!results.length) { acDrop.classList.remove('open'); return; }
      acDrop.innerHTML = results.map((p, i) => `
        <div class="ac-item" data-i="${i}" onmousedown="acSelect(${i})">
          <span class="ac-item-title">${escapeHtml(p.title)}</span>
          <span class="ac-item-meta">${escapeHtml(p.site)} · ${escapeHtml(p.price || '')}</span>
        </div>
      `).join('');
      acDrop._results = results;
      acDrop.classList.add('open');
    }

    function acSelect(i) {
      const p = acDrop._results?.[i];
      if (!p) return;
      inpName.value = p.title;
      if (p.price) {
        const num = parseFloat(p.price.replace(/[^\d,.]/g, '').replace(',', '.'));
        if (!isNaN(num)) document.getElementById('inp-price').value = num.toFixed(2);
      }
      // pré-sélectionne la boutique si disponible
      const sel = document.getElementById('inp-boutique');
      if (p.site) {
        const opt = [...sel.options].find(o => o.value === p.site);
        if (opt) sel.value = p.site;
      }
      acDrop.classList.remove('open');
    }

    inpName.addEventListener('input', () => acRender(acSearch(inpName.value)));
    inpName.addEventListener('blur', () => setTimeout(() => acDrop.classList.remove('open'), 150));
    inpName.addEventListener('keydown', e => {
      const items = acDrop.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') {
        acIndex = Math.min(acIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
        e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        acIndex = Math.max(acIndex - 1, -1);
        items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
        e.preventDefault();
      } else if (e.key === 'Enter') {
        if (acIndex >= 0) { acSelect(acIndex); }
        else { acDrop.classList.remove('open'); addPurchase(); }
      } else if (e.key === 'Escape') {
        acDrop.classList.remove('open');
      }
    });

    /* ── Init boutiques ── */
    async function loadBoutiques() {
      const [active, disabled] = await Promise.all([
        fetch('/api/health').then(r => r.json()),
        fetch('/api/disabled').then(r => r.json()),
      ]);
      const sel = document.getElementById('inp-boutique');
      [...active, ...disabled].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = s.name;
        sel.appendChild(opt);
      });
    }

    /* ── Init produits pour autocomplete ── */
    async function loadProducts() {
      const data = await fetch('/api/products').then(r => r.json());
      allProducts = data.products || [];
    }

    /* ── Liste achats ── */
    async function load() {
      const data = await fetch('/api/purchases').then(r => r.json());
      const total = data.reduce((s, p) => s + p.price * (p.quantity || 1), 0);
      const units = data.reduce((s, p) => s + (p.quantity || 1), 0);

      document.getElementById('stat-total').textContent = fmt(total);
      document.getElementById('stat-lines').textContent = data.length;
      document.getElementById('stat-units').textContent = units;

      const list = document.getElementById('list');
      if (!data.length) {
        list.innerHTML = '<div class="empty">Aucun achat enregistré.</div>';
        return;
      }
      list.innerHTML = data.slice().reverse().map(p => {
        const qty = p.quantity || 1;
        const lineTotal = p.price * qty;
        return `
          <div class="purchase-row">
            <div>
              <div class="p-name">${escapeHtml(p.name)}</div>
              <div class="p-meta">
                ${p.boutique ? `<span class="p-boutique">${escapeHtml(p.boutique)}</span>` : ''}
                ${p.note ? `<span>${escapeHtml(p.note)}</span>` : ''}
              </div>
            </div>
            <div class="p-qty">×${qty}</div>
            <div class="p-unit">${fmt(p.price)} / u.</div>
            <div class="p-total">${fmt(lineTotal)}</div>
            <div class="p-date">${fmtDate(p.date)}</div>
            <button class="btn-del" onclick="deletePurchase('${p.id}')" title="Supprimer">✕</button>
          </div>`;
      }).join('');
    }

    async function addPurchase() {
      const name     = inpName.value.trim();
      const boutique = document.getElementById('inp-boutique').value;
      const qty      = parseInt(document.getElementById('inp-qty').value) || 1;
      const price    = parseFloat(document.getElementById('inp-price').value);
      if (!name || isNaN(price)) return;

      await fetch('/api/purchases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, boutique, quantity: qty, price }),
      });
      inpName.value = '';
      document.getElementById('inp-price').value = '';
      document.getElementById('inp-qty').value = '1';
      document.getElementById('inp-boutique').value = '';
      acDrop.classList.remove('open');
      load();
    }

    document.getElementById('inp-price').addEventListener('keydown', e => {
      if (e.key === 'Enter') addPurchase();
    });

    loadBoutiques();
    loadProducts();
    load();
  </script>
</body>
</html>
